server {
  listen 80;
  server_name info.astroguru.app;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /info-home.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /brand-home.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
