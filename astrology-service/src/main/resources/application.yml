server:
  port: 8083

spring:
  application:
    name: astrology-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mystic_astrology}
    username: ${DB_USER:mystic}
    password: ${DB_PASSWORD:mystic123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mystic}
    password: ${RABBITMQ_PASSWORD:mystic123}
    virtual-host: ${RABBITMQ_VHOST:mystic}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mystic123}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  task:
    scheduling:
      pool:
        size: 4

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info

groq:
  api-key: ${GROQ_API_KEY}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}

ai-orchestrator:
  url: ${AI_ORCHESTRATOR_URL:http://localhost:8084}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

# "Bugünkü Kişisel Planım" content-quality tunables. Bump `version` whenever the composer
# or catalog changes so stored plans regenerate without a migration.
personal-plan:
  version: ${PERSONAL_PLAN_VERSION:pp-v1}
  history-days: ${PERSONAL_PLAN_HISTORY_DAYS:7}
  semantic-similarity-threshold: ${PERSONAL_PLAN_SIMILARITY_THRESHOLD:0.82}
  max-regenerations-per-day: ${PERSONAL_PLAN_MAX_REGENERATIONS:2}
  max-life-area-cards: ${PERSONAL_PLAN_MAX_AREA_CARDS:2}
  max-timeline-slots: ${PERSONAL_PLAN_MAX_TIMELINE_SLOTS:3}
  profile-connect-timeout-ms: ${PERSONAL_PLAN_PROFILE_CONNECT_TIMEOUT_MS:2000}
  profile-read-timeout-ms: ${PERSONAL_PLAN_PROFILE_READ_TIMEOUT_MS:4000}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}

api-ninjas:
  api-key: ${API_NINJAS_KEY:}

logging:
  level:
    com.mysticai.astrology: DEBUG

internal:
  gateway:
    key: ${INTERNAL_GATEWAY_KEY:local-dev-internal-gateway-key-change-me}

app:
  flyway:
    auto-repair-known-checksum-mismatch: ${FLYWAY_AUTO_REPAIR_KNOWN_CHECKSUM_MISMATCH:true}
